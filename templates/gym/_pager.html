{% if page.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Pages">
  <small class="text-secondary">Page {{ page.number }} of {{ page.paginator.num_pages }}</small>
  <div class="d-flex gap-2">
    {% if page.has_previous %}<a class="btn btn-sm btn-ghost" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
    {% if page.has_next %}<a class="btn btn-sm btn-ghost" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>{% endif %}
  </div>
</nav>
{% endif %}
